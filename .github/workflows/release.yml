name: Release

# tag 是唯一触发器和版本源：git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 允许手动触发（调试流水线用）

permissions:
  contents: write           # 创建 Release + 上传产物

jobs:
  # ── 1. 测试门禁：测试不过就不发版 ──
  test:
    name: Test gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run pytest
        shell: bash
        env:
          SECRET_KEY: ci-secret-do-not-use-in-prod
          LLM_API_KEY: ci-fake-key
          ADMIN_PASSWORD: ci-admin
        run: pytest tests/ --tb=short -q

  # ── 2. 桌面端：PyInstaller → Tauri → 签名 → Release ──
  desktop:
    name: Build desktop installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          # refs/tags/v0.2.0 → 0.2.0；手动触发时回落到 Cargo.toml 里的版本
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Stamp version into Cargo.toml (single version source)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 只替换 [package] 段的第一处 version，不动依赖的版本号
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend.exe (self-contained Python backend)
        shell: bash
        run: pyinstaller backend.spec --noconfirm

      - name: Stage backend as Tauri sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp dist/backend.exe "src-tauri/binaries/backend-x86_64-pc-windows-msvc.exe"
          ls -la src-tauri/binaries/

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installer + updater artifacts
        shell: bash
        env:
          # 签名私钥：丢了就再也发不出能被老客户端接受的更新，务必离线备份
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo tauri build

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          # Tauri 产出 <name>_<version>_x64-setup.exe 和同名 .sig
          SETUP=$(find "$NSIS_DIR" -name "*-setup.exe" | head -1)
          SIG_FILE=$(find "$NSIS_DIR" -name "*-setup.exe.sig" | head -1)
          if [ -z "$SETUP" ] || [ -z "$SIG_FILE" ]; then
            echo "::error::installer or signature missing — is createUpdaterArtifacts enabled and the signing key set?"
            ls -R "$NSIS_DIR" || true
            exit 1
          fi

          SIGNATURE=$(cat "$SIG_FILE")
          REPO="${GITHUB_REPOSITORY}"

          # productName 含空格 → 文件名是 "Jingent AI_x.y.z_x64-setup.exe"，
          # 而 GitHub 上传时会把空格替换成点。URL 必须用替换后的名字，否则更新 404。
          ASSET="$(basename "$SETUP")"
          ASSET="${ASSET// /.}"
          echo "asset name on GitHub: $ASSET"

          # version 必须与 tag 严格一致，否则客户端判断不出有新版本
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "See the release notes for what changed in v$VERSION.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/$REPO/releases/download/v$VERSION/$ASSET"
              }
            }
          }
          EOF
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jingent AI v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json

  # ── 3. 服务端部署 ──
  # 需要先在仓库 Secrets 配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，
  # 配好后把下面的 if: false 删掉即可启用。
  server:
    name: Deploy server
    needs: test
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/jingent
            git fetch --all --tags
            git checkout "${{ github.ref_name }}"
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart jingent
            sleep 3
            curl -fsS http://127.0.0.1:8000/health
