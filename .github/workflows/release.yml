name: Release

# tag 是唯一触发器和版本源：git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 允许手动触发（调试流水线用）

permissions:
  contents: write           # 创建 Release + 上传产物

jobs:
  # ── 1. 测试门禁：测试不过就不发版 ──
  test:
    name: Test gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run pytest
        shell: bash
        env:
          SECRET_KEY: ci-secret-do-not-use-in-prod
          LLM_API_KEY: ci-fake-key
          ADMIN_PASSWORD: ci-admin
        run: pytest tests/ --tb=short -q

  # ── 3. 服务端部署 ──
  # 需要先在仓库 Secrets 配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，
  # 配好后把下面的 if: false 删掉即可启用。
  server:
    name: Deploy server
    needs: test
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/jingent
            git fetch --all --tags
            git checkout "${{ github.ref_name }}"
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart jingent
            sleep 3
            curl -fsS http://127.0.0.1:8000/health
