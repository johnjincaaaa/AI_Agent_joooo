[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to sys.path (pytest does this in most setups)
pythonpath = .

addopts =
    -v
    --strict-markers
    --tb=short
    --ignore=src-tauri
    --ignore=.venv
    --ignore=venv

# Markers
markers =
    slow: tests that need network or take > 1s
    integration: end-to-end / API integration tests
    unit: pure unit tests (fast)
