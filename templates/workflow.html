<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Jingent AI - 无代码工作流</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('jingent_colormode') || localStorage.getItem('app_theme');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.documentElement.setAttribute('data-color-mode', 'light');
                } else if (saved === 'dark') {
                    document.documentElement.setAttribute('data-color-mode', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="../static/css/page_chat.css?v={{ ASSET_VERSION }}">
    <link rel="stylesheet" href="../static/css/page_home.css?v={{ ASSET_VERSION }}">
    <link rel="stylesheet" href="../static/css/page_workflow.css?v={{ ASSET_VERSION }}">
    <link rel="icon" href="../static/a.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- 顶部工具栏 -->
<header class="wf-toolbar">
    <div class="wf-toolbar-left">
        <a href="/chat" class="wf-back-btn" title="返回聊天">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <input type="text" class="wf-name-input" id="workflowName" value="未命名工作流" placeholder="工作流名称">
    </div>
    <div class="wf-toolbar-right">
        <button class="wf-btn wf-btn-secondary" id="templateLibBtn" title="工作流模板库">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>模板库</span>
        </button>
        <button class="wf-btn wf-btn-secondary" id="clearBtn" title="清空画布">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>清空</span>
        </button>
        <button class="wf-btn wf-btn-secondary" id="saveBtn" title="保存工作流">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>保存</span>
        </button>
        <button class="wf-btn wf-btn-primary" id="runBtn" title="运行工作流">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>运行</span>
        </button>
    </div>
</header>

<!-- 主体布局 -->
<div class="wf-layout">
    <!-- 左侧：节点面板 -->
    <aside class="wf-node-panel">
        <div class="wf-panel-title">节点库</div>
        <div class="wf-node-category">
            <div class="wf-category-label">基础</div>
            <div class="wf-node-item" draggable="true" data-type="start">
                <div class="wf-node-icon wf-icon-start">▶</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">开始</div>
                    <div class="wf-node-desc">工作流入口</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="end">
                <div class="wf-node-icon wf-icon-end">■</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">结束</div>
                    <div class="wf-node-desc">工作流出口</div>
                </div>
            </div>
        </div>
        <div class="wf-node-category">
            <div class="wf-category-label">AI 处理</div>
            <div class="wf-node-item" draggable="true" data-type="ai_chat">
                <div class="wf-node-icon wf-icon-ai">🤖</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">AI 对话</div>
                    <div class="wf-node-desc">调用大模型生成回复</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="code">
                <div class="wf-node-icon wf-icon-code">🐍</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">代码执行</div>
                    <div class="wf-node-desc">在沙箱中运行 Python</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="template">
                <div class="wf-node-icon wf-icon-template">📋</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">场景模板</div>
                    <div class="wf-node-desc">使用预设场景提示词</div>
                </div>
            </div>
        </div>
        <div class="wf-node-category">
            <div class="wf-category-label">控制流</div>
            <div class="wf-node-item" draggable="true" data-type="condition">
                <div class="wf-node-icon wf-icon-condition">❓</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">条件判断</div>
                    <div class="wf-node-desc">根据条件分支执行</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="loop">
                <div class="wf-node-icon wf-icon-loop">🔄</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">循环</div>
                    <div class="wf-node-desc">按次数或列表循环</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="merge">
                <div class="wf-node-icon wf-icon-merge">🔀</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">合并</div>
                    <div class="wf-node-desc">合并多路输入</div>
                </div>
            </div>
            <div class="wf-node-item" draggable="true" data-type="user_input">
                <div class="wf-node-icon wf-icon-input">💬</div>
                <div class="wf-node-info">
                    <div class="wf-node-name">用户输入</div>
                    <div class="wf-node-desc">等待用户输入内容</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- 中间：画布 -->
    <main class="wf-canvas-wrap" id="canvasWrap">
        <svg class="wf-edges-svg" id="edgesSvg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--border-strong)"/>
                </marker>
            </defs>
        </svg>
        <div class="wf-canvas" id="canvas"></div>
    </main>

    <!-- 右侧：属性面板 -->
    <aside class="wf-prop-panel" id="propPanel">
        <div class="wf-panel-title">属性配置</div>
        <div class="wf-prop-empty" id="propEmpty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <p>选择一个节点进行配置</p>
        </div>
        <div class="wf-prop-content" id="propContent" hidden></div>
    </aside>
</div>

<!-- 提示条 -->
<div class="wf-tip" id="wfTip"></div>

<script src="../static/js/config.js?v={{ ASSET_VERSION }}"></script>
<script src="../static/js/theme-bar.js?v={{ ASSET_VERSION }}"></script>
<script src="../static/js/theme.js?v={{ ASSET_VERSION }}"></script>
<script src="../static/js/i18n.js?v={{ ASSET_VERSION }}"></script>
<script src="../static/js/workflow.js?v={{ ASSET_VERSION }}"></script>

</body>
</html>
